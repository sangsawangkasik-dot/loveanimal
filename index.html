<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR เกม: ช่วยน้องสัตว์เลือกให้ถูก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            touch-action: manipulation;
        }
        .animate-pop {
            animation: pop 0.3s ease-out;
        }
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .choice-card {
            transition: transform 0.1s, background-color 0.2s;
        }
        .choice-card:active {
            transform: scale(0.95);
        }
        /* สำหรับ Hand Tracking */
        #webcam-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.7;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* กลับด้านกระจกเงา */
        }
        /* Cursor สำหรับมือ */
        #hand-cursor {
            position: fixed;
            width: 28px;
            height: 28px;
            background-color: rgba(250, 204, 21, 0.9);
            border: 4px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 50;
            display: none;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.8);
        }
        /* วงแหวนโหลดเวลาจ่อมือ */
        .loading-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 10px solid rgba(74, 222, 128, 0.2);
            border-top-color: rgba(74, 222, 128, 1);
            animation: spin 1.5s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body class="bg-blue-50/80 h-screen flex flex-col overflow-hidden relative">

    <!-- วิดีโอจากกล้อง (เปิดครั้งเดียวจบ) -->
    <div id="webcam-container">
        <video id="webcam" autoplay playsinline></video>
    </div>
    <!-- Cursor มือ -->
    <div id="hand-cursor"></div>

    <!-- หน้าจอเริ่มต้น -->
    <div id="start-screen" class="flex-1 flex flex-col items-center justify-center p-8 z-10">
        <h1 class="text-5xl font-bold text-teal-600 mb-4 text-center drop-shadow-sm">เกมช่วยน้องสัตว์</h1>
        <p class="text-2xl text-gray-700 mb-8 text-center">ใช้นิ้ววิเศษของคุณ<br>เลือกภาพที่ถูกต้องนะ!</p>
        <button onclick="startGame()" class="bg-teal-500 hover:bg-teal-600 text-white font-bold py-5 px-10 rounded-full text-3xl shadow-xl transform transition hover:scale-105 animate-bounce">
            เริ่มเล่นเลย! ▶️
        </button>
    </div>

    <!-- หน้าจอเกม -->
    <div id="game-screen" class="hidden flex-1 flex flex-col p-4 max-w-xl mx-auto w-full z-10 relative justify-between">
        <!-- แถบความคืบหน้า -->
        <div class="flex justify-between items-center bg-white/90 backdrop-blur rounded-full px-6 py-3 shadow-md">
            <span class="font-bold text-teal-700 text-xl">ข้อที่ <span id="current-q-num">1</span>/5</span>
            <div class="flex gap-2" id="score-tracker"></div>
        </div>

        <!-- กรอบสถานการณ์ (ด้านบน) -->
        <div class="bg-white rounded-3xl p-4 shadow-xl border-4 border-teal-400 flex flex-col items-center animate-pop relative w-full h-[26vh] min-h-[160px]">
            <div class="absolute -top-4 bg-teal-500 text-white px-6 py-1 rounded-full text-base font-bold shadow-md z-10">เกิดอะไรขึ้นนะ?</div>
            <img id="situation-img" class="w-full h-full object-contain rounded-xl" src="" alt="Situation">
        </div>

        <!-- พื้นที่ตัวเลือก (ซ้าย - ขวา) -->
        <div class="flex gap-6 w-full pb-4">
            <!-- ตัวเลือก ซ้าย -->
            <button id="btn-left" onclick="checkAnswer('left')" class="choice-card flex-1 aspect-square bg-white rounded-3xl border-6 border-blue-400 flex flex-col items-center justify-center p-3 relative overflow-hidden shadow-xl">
                <img id="choice-left-img" class="w-full h-full object-cover rounded-2xl pointer-events-none" src="" alt="Choice Left">
                <div id="loading-left" class="loading-ring"></div>
            </button>

            <!-- ตัวเลือก ขวา -->
            <button id="btn-right" onclick="checkAnswer('right')" class="choice-card flex-1 aspect-square bg-white rounded-3xl border-6 border-pink-400 flex flex-col items-center justify-center p-3 relative overflow-hidden shadow-xl">
                <img id="choice-right-img" class="w-full h-full object-cover rounded-2xl pointer-events-none" src="" alt="Choice Right">
                <div id="loading-right" class="loading-ring"></div>
            </button>
        </div>
    </div>

    <!-- Overlay แสดงผล ถูก/ผิด -->
    <div id="feedback-overlay" class="hidden absolute inset-0 bg-black/50 z-50 flex items-center justify-center pointer-events-none">
        <div id="feedback-icon" class="text-9xl animate-pop">✅✨</div>
    </div>

    <!-- หน้าจอจบเกม -->
    <div id="end-screen" class="hidden flex-1 flex flex-col items-center justify-center p-8 z-10 bg-white/95 backdrop-blur m-6 rounded-3xl shadow-2xl max-w-lg mx-auto w-full self-center my-auto">
        <h2 class="text-5xl font-bold text-teal-700 mb-4">จบเกมแล้ว!</h2>
        <p class="text-2xl text-gray-700 mb-2">หนูทำได้คะแนน</p>
        <div class="text-7xl font-bold text-teal-500 mb-4"><span id="final-score">0</span> / 5</div>
        <p class="text-xl text-gray-600 mb-8">ยอดเยี่ยมมาก ⭐</p>
        <button onclick="restartGame()" class="bg-teal-500 hover:bg-teal-600 text-white font-bold py-4 px-10 rounded-full text-2xl shadow-lg">
            เล่นอีกครั้ง 🔄
        </button>
    </div>

    <script>
        const allQuestionsData = [
            { sitImg: "images/s1.png", ansAImg: "images/a1.png", ansBImg: "images/b1.png", correctIsA: true },
            { sitImg: "images/s2.png", ansAImg: "images/a2.png", ansBImg: "images/b2.png", correctIsA: false },
            { sitImg: "images/s3.png", ansAImg: "images/a3.png", ansBImg: "images/b3.png", correctIsA: true },
            { sitImg: "images/s4.png", ansAImg: "images/a4.png", ansBImg: "images/b4.png", correctIsA: false },
            { sitImg: "images/s5.png", ansAImg: "images/a5.png", ansBImg: "images/b5.png", correctIsA: true },
            { sitImg: "images/s6.png", ansAImg: "images/a6.png", ansBImg: "images/b6.png", correctIsA: false },
            { sitImg: "images/s7.png", ansAImg: "images/a7.png", ansBImg: "images/b7.png", correctIsA: false },
            //{ sitImg: "images/s8.png", ansAImg: "images/a8.png", ansBImg: "images/b8.png", correctIsA: true },
            //{ sitImg: "images/s9.png", ansAImg: "images/a9.png", ansBImg: "images/b9.png", correctIsA: false },
            //{ sitImg: "images/s10.png", ansAImg: "images/a10.png", ansBImg: "images/b10.png", correctIsA: true },
        ];

        let gameQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let correctSide = '';
        let isProcessing = false;
        let audioCtx;

        let hands;
        let camera;
        let handTrackingInitialized = false;
        let hoverStartTime = 0;
        let hoverTarget = null;
        const HOVER_DURATION = 1500;

        // เริ่มต้นเปิดกล้องทันทีที่โหลดหน้าเว็บ (เปิดแค่ครั้งเดียวจบ)
        window.addEventListener('DOMContentLoaded', () => {
            setupCamera();
        });

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.4);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        function speakCompliment() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance('เก่งมาก');
                msg.lang = 'th-TH';
                msg.rate = 1.1;
                msg.pitch = 1.2;
                window.speechSynthesis.speak(msg);
            }
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            // สุ่มเลือก 5 ข้อ และบังคับสลับฝั่งซ้าย/ขวาให้กระจายตัวเท่ากัน (เช่น ซ้าย 2-3 ข้อ ขวา 2-3 ข้อ)
            let shuffled = [...allQuestionsData].sort(() => 0.5 - Math.random()).slice(0, 5);
            let leftCount = 0;
            
            gameQuestions = shuffled.map((q, idx) => {
                // บังคับให้ 2 ข้อแรกสลับฝั่งกันแน่นอน และข้อที่เหลือสุ่มอิสระแต่คุมไม่ให้กองอยู่ฝั่งเดียวเกิน 3 ข้อ
                let forceLeft;
                if (idx < 2) {
                    forceLeft = (idx === 0); // ข้อแรกซ้าย ข้อสองขวา (หรือสลับ)
                } else {
                    forceLeft = leftCount < 3 ? (Math.random() > 0.5) : false;
                }
                
                if (forceLeft) leftCount++;
                return { ...q, forceLeft };
            });

            score = 0;
            currentQuestionIndex = 0;
            document.getElementById('score-tracker').innerHTML = '';
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= gameQuestions.length) {
                showEndScreen();
                return;
            }

            const q = gameQuestions[currentQuestionIndex];
            document.getElementById('current-q-num').innerText = currentQuestionIndex + 1;
            
            const situationEl = document.getElementById('situation-img');
            situationEl.src = q.sitImg;
            situationEl.classList.remove('animate-pop');
            void situationEl.offsetWidth;
            situationEl.classList.add('animate-pop');

            // ใช้ค่า forceLeft ที่คุมสัดส่วนการกระจายตัวซ้าย/ขวาไว้แล้ว
            const isLeftCorrect = q.forceLeft;
            correctSide = isLeftCorrect ? 'left' : 'right';

            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');
            const imgLeft = document.getElementById('choice-left-img');
            const imgRight = document.getElementById('choice-right-img');

            btnLeft.classList.remove('bg-green-200', 'bg-red-200');
            btnRight.classList.remove('bg-green-200', 'bg-red-200');
            document.getElementById('loading-left').style.display = 'none';
            document.getElementById('loading-right').style.display = 'none';

            if (isLeftCorrect) {
                imgLeft.src = q.correctIsA ? q.ansAImg : q.ansBImg;
                imgRight.src = q.correctIsA ? q.ansBImg : q.ansAImg;
            } else {
                imgRight.src = q.correctIsA ? q.ansAImg : q.ansBImg;
                imgLeft.src = q.correctIsA ? q.ansBImg : q.ansAImg;
            }
            
            isProcessing = false;
            hoverTarget = null;
        }

        function checkAnswer(selectedSide) {
            if (isProcessing) return;
            isProcessing = true;

            const isCorrect = (selectedSide === correctSide);
            const overlay = document.getElementById('feedback-overlay');
            const icon = document.getElementById('feedback-icon');
            const selectedBtn = document.getElementById(selectedSide === 'left' ? 'btn-left' : 'btn-right');

            if (isCorrect) {
                playSound('correct');
                speakCompliment();
                score++;
                icon.innerText = '✅✨';
                selectedBtn.classList.add('bg-green-200');
            } else {
                playSound('wrong');
                icon.innerText = '❌';
                selectedBtn.classList.add('bg-red-200');

                hoverTarget = null;
                document.getElementById('loading-left').style.display = 'none';
                document.getElementById('loading-right').style.display = 'none';
            }

            const scoreTracker = document.getElementById('score-tracker');
            const star = document.createElement('span');
            star.innerText = isCorrect ? '⭐' : '⚫';
            star.classList.add('text-2xl', 'animate-pop');
            scoreTracker.appendChild(star);

            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.add('hidden');
                currentQuestionIndex++;
                loadQuestion();
            }, 2000);
        }

        function showEndScreen() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
            // หมายเหตุ: เราไม่ปิดกล้องตอนจบเกม เพื่อให้กล้องทำงานต่อเนื่อง ไม่ต้องขอสิทธิ์ใหม่เวลาเล่นรอบถัดไป
        }

        function restartGame() {
            document.getElementById('end-screen').classList.add('hidden');
            startGame();
        }

        async function setupCamera() {
            if (handTrackingInitialized) return;

            const videoElement = document.getElementById('webcam');
            
            hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });
            hands.onResults(onHandsResults);

            try {
                camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({image: videoElement});
                    },
                    width: 640,
                    height: 480
                });
                await camera.start();
                handTrackingInitialized = true;
                console.log("Camera initialized successfully.");
            } catch (error) {
                console.error("Error starting camera:", error);
            }
        }

        function onHandsResults(results) {
            const cursor = document.getElementById('hand-cursor');
            
            // ให้เคอร์เซอร์แสดงผลตลอดเวลาที่ตรวจจับมือได้ (แม้จะยังไม่ได้กดเริ่มเกม เพื่อให้ผู้เล่นเช็คว่ากล้องพร้อมไหม)
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indexFingerTip = landmarks[8];
                
                const x = (1 - indexFingerTip.x) * window.innerWidth;
                const y = indexFingerTip.y * window.innerHeight;

                cursor.style.display = 'block';
                cursor.style.left = `${x}px`;
                cursor.style.top = `${y}px`;

                // ตรวจสอบการเลือกเฉพาะตอนที่อยู่ในหน้าเล่นเกมเท่านั้น
                const gameScreen = document.getElementById('game-screen');
                if (!gameScreen.classList.contains('hidden')) {
                    detectHover(x, y);
                }
            } else {
                cursor.style.display = 'none';
                resetHover();
            }
        }

        function detectHover(x, y) {
            if (isProcessing) return;

            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');
            const loadingLeft = document.getElementById('loading-left');
            const loadingRight = document.getElementById('loading-right');

            let currentTarget = null;

            if (isFingerOver(btnLeft, x, y)) {
                currentTarget = 'left';
            } else if (isFingerOver(btnRight, x, y)) {
                currentTarget = 'right';
            }

            if (currentTarget) {
                if (hoverTarget !== currentTarget) {
                    hoverTarget = currentTarget;
                    hoverStartTime = Date.now();
                    loadingLeft.style.display = currentTarget === 'left' ? 'block' : 'none';
                    loadingRight.style.display = currentTarget === 'right' ? 'block' : 'none';
                } else {
                    const elapsedTime = Date.now() - hoverStartTime;
                    if (elapsedTime >= HOVER_DURATION) {
                        checkAnswer(currentTarget);
                        resetHover();
                    }
                }
            } else {
                resetHover();
            }
        }

        function resetHover() {
            hoverTarget = null;
            document.getElementById('loading-left').style.display = 'none';
            document.getElementById('loading-right').style.display = 'none';
        }

        function isFingerOver(element, x, y) {
            const rect = element.getBoundingClientRect();
            return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
        }
    </script>
</body>
</html>
